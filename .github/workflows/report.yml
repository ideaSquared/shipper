# Reusable Discord report, for a repo that deploys with its own workflow: run it after that deploy
# job with the job's result (see gate.yml for the full pattern). It posts who shipped what, the
# commit range since the last live commit, and whether the deploy succeeded. For a successful deploy
# it first runs the environment's `smoke:` checks from ship.yaml; a failed smoke check is the only
# thing that fails this run (the deploy has already happened, so nothing is rolled back).
name: Ship report

on:
  workflow_call:
    inputs:
      environment:
        description: Environment from ship.yaml that was deployed to.
        type: string
        required: true
      outcome:
        description: The deploy job's result (needs.<job>.result) — success, failure or cancelled.
        type: string
        required: true
      shipper-ref:
        description: Ref of ideaSquared/shipper whose scripts run. Keep it the same as the ref in your uses line. A caller pinned to a commit SHA must pass that same SHA here; the v1 default is for callers still on @v1.
        type: string
        default: v1

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  SHIP_NOTIFY_URL: https://ideasquared-bot.idea-squared.workers.dev/ship

jobs:
  report:
    name: Report (${{ inputs.environment }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ideaSquared/shipper
          ref: ${{ inputs.shipper-ref }}
          path: shipper
          persist-credentials: false
      # The Node the caller's CI tests: its .nvmrc, or 24 when it has none.
      - name: Pick the Node version
        run: |
          if [ -f app/.nvmrc ]; then cp app/.nvmrc node-version; else echo 24 > node-version; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --prod
        working-directory: shipper
      - run: node src/main.ts report "$SHIP_ENVIRONMENT"
        working-directory: shipper
        env:
          SHIP_ENVIRONMENT: ${{ inputs.environment }}
          SHIP_OUTCOME: ${{ inputs.outcome }}
          SHIP_SHA: ${{ github.sha }}
          SHIP_REPO_ROOT: ${{ github.workspace }}/app
          GITHUB_TOKEN: ${{ github.token }}
          SHIP_NOTIFY_SECRET: ${{ secrets.SHIP_NOTIFY_SECRET }}
