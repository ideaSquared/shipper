# Reusable deploy workflow. A product repo calls it with:
#
#   deploy:
#     needs: test
#     permissions: { contents: read, checks: read, deployments: write }
#     uses: ideaSquared/shipper/.github/workflows/deploy.yml@v1
#     with:
#       environment: production
#     secrets: inherit
#
# `sha` deploys a given commit instead of the run's own; `rollback: true` lets that commit be older
# than what is live, as long as it was live on this environment before (see ship rollback).
#
# It reads ship.yaml from the calling repo, runs the gate (commit is on the default branch,
# required checks passed, required environments already have it), then deploys each component.
# The deploy job runs in the GitHub Environment of the same name (which must already exist in the
# repo's settings) for its secrets and required reviewers. GitHub does not record a Deployment for
# the job (`deployment: false`): shipper creates one itself for the commit it deploys and marks it
# in_progress, then success or failure. That is why the calling job grants `deployments: write`.
name: Ship

on:
  workflow_call:
    inputs:
      environment:
        description: Environment from ship.yaml to deploy to.
        type: string
        required: true
      sha:
        description: Full SHA of the commit to deploy. Empty deploys the commit the run is for (github.sha).
        type: string
        default: ''
      rollback:
        description: Put back a commit that was live on this environment before, even though it is older than what is live.
        type: boolean
        default: false
      shipper-ref:
        description: Ref of ideaSquared/shipper whose scripts run. Keep it the same as the ref in your uses line.
        type: string
        default: v1

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  WRANGLER_SEND_METRICS: 'false'
  # Where the deploy message goes: the ideaSquared bot, which posts it to the project's -github
  # channel. Signed with SHIP_NOTIFY_SECRET (an org secret); without it the deploy still runs.
  SHIP_NOTIFY_URL: https://ideasquared-bot.idea-squared.workers.dev/ship

jobs:
  gate:
    name: Gate (${{ inputs.environment }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      deployments: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ideaSquared/shipper
          ref: ${{ inputs.shipper-ref }}
          path: shipper
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --prod
        working-directory: shipper
      - run: node src/main.ts gate "$SHIP_ENVIRONMENT"
        working-directory: shipper
        env:
          SHIP_ENVIRONMENT: ${{ inputs.environment }}
          SHIP_SHA: ${{ inputs.sha || github.sha }}
          SHIP_ROLLBACK: ${{ inputs.rollback }}
          SHIP_REPO_ROOT: ${{ github.workspace }}/app
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHIP_NOTIFY_SECRET: ${{ secrets.SHIP_NOTIFY_SECRET }}

  deploy:
    name: Deploy (${{ inputs.environment }})
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      # Use the Environment's secrets and approvals without GitHub's automatic Deployment, which
      # would name the run's commit; shipper records the Deployment itself.
      deployment: false
    permissions:
      contents: read
      deployments: write
    # One deploy per repo and environment at a time. A queued one waits; it never cancels a live one
    # (that could leave D1 migrations half applied).
    concurrency:
      group: ship-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ideaSquared/shipper
          ref: ${{ inputs.shipper-ref }}
          path: shipper
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm install --frozen-lockfile --prod
        working-directory: shipper
      - run: node src/main.ts deploy "$SHIP_ENVIRONMENT"
        working-directory: shipper
        env:
          SHIP_ENVIRONMENT: ${{ inputs.environment }}
          SHIP_SHA: ${{ inputs.sha || github.sha }}
          SHIP_ROLLBACK: ${{ inputs.rollback }}
          SHIP_REPO_ROOT: ${{ github.workspace }}/app
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          SHIP_NOTIFY_SECRET: ${{ secrets.SHIP_NOTIFY_SECRET }}
