# Reusable gate, for a repo that deploys with its own workflow (a `type: external` component):
#
#   gate:
#     permissions: { contents: read, checks: read, deployments: read }
#     uses: ideaSquared/shipper/.github/workflows/gate.yml@<full-commit-sha>  # v1.x
#     with: { environment: staging, shipper-ref: <full-commit-sha> }
#     secrets: inherit
#   deploy:
#     needs: gate
#     uses: ./.github/workflows/deploy.yml   # the repo's own deploy
#   report:
#     needs: [gate, deploy]
#     if: always() && needs.gate.result == 'success'
#     uses: ideaSquared/shipper/.github/workflows/report.yml@<full-commit-sha>  # v1.x
#     with: { environment: staging, shipper-ref: <full-commit-sha>, outcome: '${{ needs.deploy.result }}' }
#     secrets: inherit
#
# The same rules as deploy.yml's gate: on the default branch, ship.yaml's checks passed, any
# `requires` environment already has the commit, and it is not older than what is live. A blocked
# commit fails the job and posts the "blocked" message to Discord.
name: Ship gate

on:
  workflow_call:
    inputs:
      environment:
        description: Environment from ship.yaml about to be deployed to.
        type: string
        required: true
      wait-minutes:
        description: How long the gate waits when the only blockers are checks still running or a `requires` environment this commit is being deployed to right now. It fails as soon as a check fails, and on timeout. 0 fails at once, as before.
        type: number
        default: 30
      shipper-ref:
        description: Ref of ideaSquared/shipper whose scripts run. Keep it the same as the ref in your uses line. A caller pinned to a commit SHA must pass that same SHA here; the v1 default is for callers still on @v1.
        type: string
        default: v1

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  SHIP_NOTIFY_URL: https://ideasquared-bot.idea-squared.workers.dev/ship

jobs:
  gate:
    name: Gate (${{ inputs.environment }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ideaSquared/shipper
          ref: ${{ inputs.shipper-ref }}
          path: shipper
          persist-credentials: false
      # The Node the caller's CI tests: its .nvmrc, or 24 when it has none.
      - name: Pick the Node version
        run: |
          if [ -f app/.nvmrc ]; then cp app/.nvmrc node-version; else echo 24 > node-version; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --prod
        working-directory: shipper
      - run: node src/main.ts gate "$SHIP_ENVIRONMENT"
        working-directory: shipper
        env:
          SHIP_ENVIRONMENT: ${{ inputs.environment }}
          SHIP_WAIT_MINUTES: ${{ inputs.wait-minutes }}
          SHIP_SHA: ${{ github.sha }}
          SHIP_ROLLBACK: 'false'
          SHIP_REPO_ROOT: ${{ github.workspace }}/app
          GITHUB_TOKEN: ${{ github.token }}
          # The caller repo's variable (set by `ship freeze`); a reusable workflow's `vars` are the caller's.
          SHIP_FREEZE: ${{ vars.SHIP_FREEZE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHIP_NOTIFY_SECRET: ${{ secrets.SHIP_NOTIFY_SECRET }}
