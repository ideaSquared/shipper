# Releases shipper: tags the package.json version as an annotated vX.Y.Z with a GitHub Release (notes
# generated from the merged pull requests, whose titles are Conventional Commits), then moves the v1 tag.
# Bump `version` in package.json (1.x.y) in the PR that is to be released; a version already tagged on another
# commit is refused, and a re-run after a failed release reuses the tag. Product repos that still call shipper at
# @v1 pick up whatever v1 points at, with the
# Cloudflare token in reach, so v1 moves only here: by hand (Actions > Release > Run workflow), and only
# after a reviewer approves the `release` GitHub Environment (Settings > Environments > release: required
# reviewers, ideally limited to the main branch). CI never moves it.
name: Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of the commit to release. Empty releases the head of main.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Runs before the approval, so a reviewer is only ever asked to approve a commit that is on main, has
  # green CI and is not marked breaking.
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the commit and check it is on main
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA:-$(git rev-parse origin/main)}"
          if ! grep -qE '^[0-9a-f]{40}$' <<<"$sha"; then
            echo "::error::sha must be a full 40-character commit SHA (got '$sha')."
            exit 1
          fi
          if ! git cat-file -e "$sha^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not a commit on main, so it cannot be released."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "test" and .conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI's test job has not passed on $SHA, so it cannot be released."
            exit 1
          fi
      # A breaking change (a `type!:` subject, or a footer line starting `BREAKING CHANGE:` or
      # `BREAKING-CHANGE:`, in any commit between v1 and this one) must not move v1; it needs a new major
      # tag by hand. Only line starts count, so a message that just mentions breaking changes still releases.
      # The version in package.json is what the tag and the GitHub Release are named after.
      - name: Check the version is a new 1.x.y
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          version="$(git show "$SHA:package.json" | jq -r .version)"
          if ! grep -qE '^1\.[0-9]+\.[0-9]+$' <<<"$version"; then
            echo "::error::package.json version is '$version'; a release moving v1 needs a 1.x.y version."
            exit 1
          fi
          # A tag already on this very commit is a retry (the Release failed after pushing it): allowed.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null \
            && [ "$(git rev-parse "refs/tags/v$version^{commit}")" != "$SHA" ]; then
            echo "::error::v$version already exists on another commit. Bump version in package.json in the pull request to release."
            exit 1
          fi
      - name: Refuse a breaking change
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          range="$SHA"
          if git rev-parse -q --verify refs/tags/v1 >/dev/null; then range="refs/tags/v1..$SHA"; fi
          if git log --format=%B "$range" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:'; then
            echo "::error::A commit up to $SHA is marked breaking, so v1 stays where it is. Release it as a new major tag by hand."
            exit 1
          fi

  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the version and publish a GitHub Release
        env:
          SHA: ${{ needs.verify.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(git show "$SHA:package.json" | jq -r .version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already pushed; reusing it."
          else
            git tag -a "v$version" -m "shipper v$version" "$SHA"
            git push origin "refs/tags/v$version"
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "The GitHub Release for v$version already exists."
          else
            # The notes start at the newest earlier vX.Y.Z release tag: never the moving v1 tag, and
            # never v$version itself when this is a retry. No earlier release: GitHub's default.
            previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "v$version" | head -n 1 || true)"
            gh release create "v$version" --verify-tag --title "v$version" --generate-notes ${previous:+--notes-start-tag "$previous"}
          fi
          echo "v$version published at $SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Move v1 to the commit
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          git tag -f v1 "$SHA"
          git push -f origin v1
          echo "v1 now points at $SHA" >> "$GITHUB_STEP_SUMMARY"
